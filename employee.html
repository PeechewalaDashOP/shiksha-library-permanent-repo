<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Dashboard – Shiksha Library</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:#0f172a;min-height:100vh;color:#1e293b}
  header{background:#1e293b;color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between}
  header h1{font-size:1.1rem;font-weight:700}
  header p{font-size:.75rem;opacity:.6;margin-top:2px}
  #branch-name-badge{font-weight:800;font-size:1.05rem;color:#f59e0b;margin-top:.15rem;letter-spacing:.02em}
  .logout-btn{background:#dc2626;border:none;color:#fff;padding:.4rem .9rem;border-radius:7px;font-size:.85rem;font-weight:600;cursor:pointer}
  .container{max-width:820px;margin:0 auto;padding:1.5rem 1rem}
  .card{background:#fff;border-radius:14px;padding:1.5rem;margin-bottom:1.25rem;box-shadow:0 2px 12px rgba(0,0,0,.08)}
  .card-title{font-size:1rem;font-weight:700;margin-bottom:1rem}
  table{width:100%;border-collapse:collapse;font-size:.875rem}
  th{text-align:left;padding:.6rem .75rem;background:#f8fafc;color:#64748b;font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em}
  td{padding:.6rem .75rem;border-bottom:1px solid #f1f5f9}
  .price-input{width:100px;padding:.4rem .6rem;border:1.5px solid #e2e8f0;border-radius:6px;font-size:.9rem;font-family:inherit}
  .save-btn{background:#f59e0b;border:none;color:#fff;padding:.4rem .9rem;border-radius:6px;font-size:.82rem;font-weight:600;cursor:pointer}
  .save-btn:disabled{background:#cbd5e1;cursor:not-allowed}
  .search-input{width:100%;padding:.6rem .85rem;border:1.5px solid #e2e8f0;border-radius:8px;font-size:.9rem;font-family:inherit;outline:none;margin-bottom:1rem}
  .search-input:focus{border-color:#f59e0b}
  .search-item{padding:.6rem .75rem;cursor:pointer;border-bottom:1px solid #f1f5f9;font-size:.88rem}
  .search-item:hover{background:#fffbeb}
  .student-photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin:1rem 0}
  .photo-slot{text-align:center}
  .photo-slot .label{font-size:.72rem;color:#64748b;text-transform:uppercase;letter-spacing:.04em;margin-bottom:.4rem;font-weight:600}
  .photo-box{width:100%;aspect-ratio:1;background:#f8fafc;border:1.5px dashed #e2e8f0;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:.78rem;overflow:hidden;margin-bottom:.5rem}
  .photo-box img{width:100%;height:100%;object-fit:cover}
  .selected-student{background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:10px;padding:.85rem 1rem;display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
  .mi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem}
  .mi-key{font-size:.7rem;color:#64748b;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
  .mi-val{font-weight:600;color:#1e293b}
  .selected-student .info .name{font-weight:700;font-size:.95rem}
  .selected-student .info .sub{font-size:.78rem;color:#64748b;margin-top:2px}
  .change-btn{background:#f1f5f9;border:none;padding:.35rem .8rem;border-radius:6px;font-size:.8rem;cursor:pointer;font-weight:500}
  .err{color:#dc2626;font-size:.82rem;margin-top:.5rem;display:none}
  .ok-msg{color:#15803d;font-size:.82rem;margin-top:.5rem;display:none}
  .spinner{width:28px;height:28px;border:3px solid #e2e8f0;border-top-color:#f59e0b;border-radius:50%;animation:spin .7s linear infinite;margin:2rem auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .login-overlay{position:fixed;inset:0;background:rgba(15,23,42,0.95);z-index:9999;display:flex;align-items:center;justify-content:center;padding:1rem}
  .login-box{background:#fff;border-radius:16px;padding:2rem;width:100%;max-width:360px}
  .login-box h2{font-size:1.2rem;font-weight:800;margin-bottom:.3rem}
  .login-box p{font-size:.85rem;color:#64748b;margin-bottom:1.25rem}
  .login-box input{width:100%;padding:.7rem .9rem;border:1.5px solid #e2e8f0;border-radius:8px;font-size:.9rem;font-family:inherit;margin-bottom:.75rem;outline:none}
  .login-box input:focus{border-color:#f59e0b}
  .login-box button{width:100%;background:#f59e0b;border:none;color:#fff;padding:.75rem;border-radius:8px;font-size:.9rem;font-weight:700;cursor:pointer;margin-top:.5rem}
  @media(max-width:520px){.student-photo-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- EMPLOYEE LOGIN OVERLAY -->
<div class="login-overlay" id="login-overlay">
  <div class="login-box">
    <h2>Employee Login</h2>
    <p>Shiksha Library — Staff Access Only</p>
    <input type="email" id="e-email" placeholder="Employee email">
    <input type="password" id="e-pwd" placeholder="Password">
    <div class="err" id="e-error"></div>
    <button onclick="employeeLogin()">Login</button>
  </div>
</div>

<header>
  <div>
    <h1>Shiksha Library Employee</h1>
    <p id="header-sub">Staff Dashboard</p>
    <p id="branch-name-badge" style="display:none"></p>
  </div>
  <button class="logout-btn" onclick="employeeLogout()">Logout</button>
</header>

<div class="container">
  <div id="loader" style="text-align:center;padding:3rem;color:#94a3b8"><div class="spinner"></div></div>
  <div id="content" style="display:none">

    <!-- POWER 1: UPDATE PRICES -->
    <div class="card">
      <div class="card-title">✏️ Update Plan Prices</div>
      <table>
        <thead><tr><th>Plan</th><th>Duration</th><th>Shift</th><th>Price (₹)</th><th></th></tr></thead>
        <tbody id="prices-body"><tr><td colspan="5" style="color:#94a3b8;text-align:center">Loading...</td></tr></tbody>
      </table>
    </div>

    <!-- POWER 2: UPDATE STUDENT PHOTO / AADHAAR -->
    <div class="card">
      <div class="card-title">📷 Update Student Photo / Aadhaar</div>
      <input type="text" class="search-input" id="student-search" placeholder="Search by name or phone..." oninput="searchStudents(this.value)">
      <div id="search-results"></div>

      <div id="selected-student-wrap" style="display:none">
        <div class="selected-student">
          <div class="info">
            <div class="name" id="sel-name"></div>
            <div class="sub" id="sel-sub"></div>
          </div>
          <button class="change-btn" onclick="clearSelectedStudent()">Change</button>
        </div>

        <div id="sel-membership-info" style="background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:10px;padding:.85rem 1rem;margin-bottom:1rem;font-size:.85rem"></div>

        <div class="student-photo-grid">
          <div class="photo-slot">
            <div class="label">Photo</div>
            <div class="photo-box" id="box-photo">No photo</div>
            <input type="file" accept="image/*" id="file-photo">
          </div>
          <div class="photo-slot">
            <div class="label">Aadhaar Front</div>
            <div class="photo-box" id="box-aadhar-front">Not uploaded</div>
            <input type="file" accept="image/*" id="file-aadhar-front">
          </div>
          <div class="photo-slot">
            <div class="label">Aadhaar Back</div>
            <div class="photo-box" id="box-aadhar-back">Not uploaded</div>
            <input type="file" accept="image/*" id="file-aadhar-back">
          </div>
        </div>

        <button class="save-btn" style="width:100%;padding:.75rem" id="save-photo-btn" onclick="savePhotos()">Save Photos</button>
        <div class="err" id="photo-error"></div>
        <div class="ok-msg" id="photo-ok"></div>
      </div>
    </div>

  </div>
</div>

<script>
const SUPABASE_URL      = "https://ojmxqckunnpthgftwbkq.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_j8mlu6_1po8jUo3k5tpMrw_l7Wq74VS";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let myBranchId = null;
let myBranchName = "";
let selectedStudent = null;

async function employeeLogin() {
  const email = document.getElementById("e-email").value.trim();
  const pwd   = document.getElementById("e-pwd").value;
  const err   = document.getElementById("e-error");
  err.style.display = "none";
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pwd });
  if (error) {
    err.textContent = "Invalid credentials.";
    err.style.display = "block";
    return;
  }
  const { data: branchId } = await sb.rpc("employee_branch_id");
  if (!branchId) {
    await sb.auth.signOut();
    err.textContent = "This account is not set up as an employee.";
    err.style.display = "block";
    return;
  }
  document.getElementById("login-overlay").style.display = "none";
  await initDashboard(branchId);
}

async function employeeLogout() {
  await sb.auth.signOut();
  window.location.reload();
}

async function checkSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { document.getElementById("loader").style.display = "none"; return; }
  const { data: branchId } = await sb.rpc("employee_branch_id");
  if (!branchId) {
    await sb.auth.signOut();
    document.getElementById("loader").style.display = "none";
    return;
  }
  document.getElementById("login-overlay").style.display = "none";
  await initDashboard(branchId);
}

async function initDashboard(branchId) {
  myBranchId = branchId;
  const { data: branch } = await sb.from("branches").select("name").eq("id", branchId).single();
  myBranchName = branch?.name || "";
  document.getElementById("branch-name-badge").textContent = "Shiksha Library " + myBranchName + " — Employee";
  document.getElementById("branch-name-badge").style.display = "block";
  document.title = "Shiksha Library " + myBranchName + " Employee Dashboard";

  document.getElementById("loader").style.display = "none";
  document.getElementById("content").style.display = "block";

  await loadPrices();
}

// ── POWER 1: PRICES ──────────────────────────────────────────────
async function loadPrices() {
  const { data: plans, error } = await sb.from("plans")
    .select("*")
    .eq("branch_id", myBranchId)
    .eq("is_active", true)
    .order("duration").order("shift");

  const body = document.getElementById("prices-body");
  if (error || !plans?.length) {
    body.innerHTML = `<tr><td colspan="5" style="color:#94a3b8;text-align:center">No plans found.</td></tr>`;
    return;
  }

  body.innerHTML = plans.map(p => `
    <tr>
      <td>${p.name}</td>
      <td>${p.duration}</td>
      <td>${p.shift}</td>
      <td><input type="number" class="price-input" id="price-${p.id}" value="${p.price}" min="1"></td>
      <td><button class="save-btn" onclick="savePrice('${p.id}')">Save</button></td>
    </tr>
  `).join("");
}

async function savePrice(planId) {
  const input = document.getElementById("price-" + planId);
  const newPrice = parseFloat(input.value);
  if (!newPrice || newPrice <= 0) { alert("Enter a valid price."); return; }

  const { error } = await sb.rpc("employee_update_plan_price", {
    p_plan_id: planId,
    p_new_price: newPrice,
  });
  if (error) { alert("Failed to update price: " + error.message); return; }
  input.style.borderColor = "#15803d";
  setTimeout(() => { input.style.borderColor = "#e2e8f0"; }, 1200);
}

// ── POWER 2: STUDENT PHOTO / AADHAAR ─────────────────────────────
let searchDebounce = null;
function searchStudents(query) {
  clearTimeout(searchDebounce);
  const resultsEl = document.getElementById("search-results");
  if (!query || query.trim().length < 2) { resultsEl.innerHTML = ""; return; }
  searchDebounce = setTimeout(async () => {
    const { data, error } = await sb.rpc("employee_search_students", { p_query: query.trim() });
    if (error || !data?.length) {
      resultsEl.innerHTML = `<div class="search-item" style="color:#94a3b8">No students found.</div>`;
      return;
    }
    resultsEl.innerHTML = data.map(s => `
      <div class="search-item" onclick='selectStudent(${JSON.stringify(s).replace(/'/g, "&#39;")})'>
        <strong>${s.full_name}</strong> · ${s.email || "—"} · ${s.student_code || "—"}
      </div>
    `).join("");
  }, 300);
}

async function selectStudent(s) {
  selectedStudent = s;
  document.getElementById("search-results").innerHTML = "";
  document.getElementById("student-search").value = "";
  document.getElementById("selected-student-wrap").style.display = "block";
  document.getElementById("sel-name").textContent = s.full_name;
  document.getElementById("sel-sub").textContent = s.email + " · " + (s.student_code || "—");

  const fmtDate = (d) => d ? new Date(d).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }) : "—";
  document.getElementById("sel-membership-info").innerHTML = `
    <div class="mi-grid">
      <div><div class="mi-key">Plan</div><div class="mi-val">${s.plan_name || "—"}</div></div>
      <div><div class="mi-key">Duration / Shift / Section</div><div class="mi-val">${[s.duration, s.shift, s.section].filter(Boolean).join(" · ") || "—"}</div></div>
      <div><div class="mi-key">Start – End</div><div class="mi-val">${fmtDate(s.start_date)} – ${fmtDate(s.end_date)}</div></div>
      <div><div class="mi-key">Status</div><div class="mi-val">${s.membership_status || "—"}</div></div>
      <div><div class="mi-key">Fixed Seat</div><div class="mi-val">${s.fixed_seat ? "Yes" : "No"}</div></div>
      <div><div class="mi-key">Locker</div><div class="mi-val">${s.locker ? "Yes" : "No"}</div></div>
    </div>
  `;

  document.getElementById("photo-error").style.display = "none";
  document.getElementById("photo-ok").style.display = "none";
  document.getElementById("file-photo").value = "";
  document.getElementById("file-aadhar-front").value = "";
  document.getElementById("file-aadhar-back").value = "";

  await loadPhotoBox("box-photo", s.photo_url, "No photo");
  await loadPhotoBox("box-aadhar-front", s.aadhar_front_url, "Not uploaded");
  await loadPhotoBox("box-aadhar-back", s.aadhar_back_url, "Not uploaded");
}

async function loadPhotoBox(boxId, path, emptyText) {
  const box = document.getElementById(boxId);
  if (!path) { box.textContent = emptyText; return; }
  try {
    const { data, error } = await sb.storage.from("student-photos").createSignedUrl(path, 3600);
    if (!error && data?.signedUrl) {
      box.innerHTML = `<img src="${data.signedUrl}" alt="">`;
    } else {
      box.textContent = "Unavailable";
    }
  } catch (e) {
    box.textContent = "Unavailable";
  }
}

function clearSelectedStudent() {
  selectedStudent = null;
  document.getElementById("selected-student-wrap").style.display = "none";
}

async function uploadIfPresent(fileInputId, pathPrefix) {
  const file = document.getElementById(fileInputId).files[0];
  if (!file) return null;
  const ext  = file.name.split(".").pop() || "jpg";
  const path = `${pathPrefix}-${selectedStudent.id}-${Date.now()}.${ext}`;
  const { error } = await sb.storage.from("student-photos").upload(path, file, { upsert: true });
  if (error) throw new Error(pathPrefix + " upload failed: " + error.message);
  return path;
}

async function savePhotos() {
  if (!selectedStudent) return;
  const errEl = document.getElementById("photo-error");
  const okEl  = document.getElementById("photo-ok");
  errEl.style.display = "none";
  okEl.style.display = "none";

  const btn = document.getElementById("save-photo-btn");
  btn.disabled = true;
  btn.textContent = "Saving...";

  try {
    const photoUrl        = await uploadIfPresent("file-photo", "student");
    const aadharFrontUrl   = await uploadIfPresent("file-aadhar-front", "aadhar-front");
    const aadharBackUrl    = await uploadIfPresent("file-aadhar-back", "aadhar-back");

    if (!photoUrl && !aadharFrontUrl && !aadharBackUrl) {
      errEl.textContent = "Choose at least one file to upload.";
      errEl.style.display = "block";
      return;
    }

    const { error } = await sb.rpc("employee_update_student_photo", {
      p_student_id: selectedStudent.id,
      p_photo_url: photoUrl,
      p_aadhar_front_url: aadharFrontUrl,
      p_aadhar_back_url: aadharBackUrl,
    });
    if (error) throw new Error(error.message);

    okEl.textContent = "Saved successfully.";
    okEl.style.display = "block";
    if (photoUrl) await loadPhotoBox("box-photo", photoUrl, "No photo");
    if (aadharFrontUrl) await loadPhotoBox("box-aadhar-front", aadharFrontUrl, "Not uploaded");
    if (aadharBackUrl) await loadPhotoBox("box-aadhar-back", aadharBackUrl, "Not uploaded");
    document.getElementById("file-photo").value = "";
    document.getElementById("file-aadhar-front").value = "";
    document.getElementById("file-aadhar-back").value = "";
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = "block";
  } finally {
    btn.disabled = false;
    btn.textContent = "Save Photos";
  }
}

checkSession();
</script>

</body>
</html>
